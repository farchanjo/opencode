[package]
name = "opencode-tools-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
publish = false
description = "Native filesystem/text tool entry points (read/write/edit/apply_patch/glob/grep) for opencode (Feature 010)."

# cdylib — dlopened by the Bun-side loader.ts via bun:ffi.
[lib]
crate-type = ["cdylib"]

[dependencies]
opencode-ffi-abi = { path = "../opencode-ffi-abi" }
serde = { workspace = true }
serde_json = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
grep-matcher = { workspace = true }

[features]
# Forward the debug-only oc_alloc_stats gate to the shared ABI crate (C18).
alloc-stats = ["opencode-ffi-abi/alloc-stats"]
# Forward the debug-only oc_debug_panic boundary-containment probe (T018, AC12).
panic-probe = ["opencode-ffi-abi/panic-probe"]

[lints]
workspace = true
